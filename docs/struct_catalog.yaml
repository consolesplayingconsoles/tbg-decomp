- name: BusState
  file: src/sectionB.h
  line: 73
  size: 972
  purpose: 'The player''s bus: the single BusState instance (var_busState_8c1bb9d0) is the hub the whole
    "driving a bus route" simulation runs through. It holds the bus''s render state (cached articulated
    sub-model pointers, world matrix, light coefficients -- a prefix byte-identical to TrafficEntry''s
    own render fields, since both are drawn by the same low-level code), its driving physics (position,
    heading, speed, acceleration history, steering angle, gear, engine-RPM needle), its route-following
    state (a 12-entry position history used for lookahead ground/junction queries, a walk along the mapped
    route line via LinePoint/LineBusNode tables, a separate lane- crossing search state machine), a block
    of per-frame junction/road- attribute query results (signal ids, speed limits, required blinker/gear/wiper
    cues for the next stop) at three lookahead points plus the bus''s own position, the rear-view-mirror
    camera''s offset/selection, and several small state machines (turn-signal/hazard blink counters, headlight
    fade, bus-stop substate). BusInitStart_8c023610/busInitPlaceBus_8c023310 (023310_bus_init) reset it
    at the start of every run; BusTask_8c022bdc (022bdc_bus) drives it every frame.

    '
