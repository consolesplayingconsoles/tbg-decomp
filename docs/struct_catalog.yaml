- name: TrafficEntry
  file: src/026710_traffic.h
  line: 49
  size: '0x514'
  purpose: The 0x514-byte per-instance state for one CPU-driven traffic entity -- a moving vehicle (TrafficDriveVehicle_8c025b98)
    or a fixed decoration such as a traffic light or sign (TrafficDriveDecoration_8c02656a). Holds the
    entity's render/model bindings, its position on a script-defined path of straight-line PathRecord
    blocks, a battery of small per-junction/per-signal 'wait' sub-state machines (fields around 0x42c/0x448/0x458/0x468/0x474)
    driven by a tiny bytecode script (TrafficRunEntryScript_8c027012), and a lookahead cache used both
    for braking on a vehicle ahead and for the player's rear-view-mirror traffic. Offsets 0x000-0x2dc
    are a byte-identical prefix shared with the player's own BusState (sectionB.h) -- functions like BusDrawPlaceEntity_8c027c3c,
    BusDrawUpdateModels_8c027958 and BusDrawFadeLights_8c028022 are legitimately called on either type
    through that shared layout.
